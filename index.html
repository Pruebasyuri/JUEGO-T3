<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operación Extracción - FPS Three.js</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="menu">
    <div>
      <h1>OPERACIÓN EXTRACCIÓN</h1>
      <p id="menuMsg">Cargando recursos…</p>
      <p class="help">WASD: moverse · Mouse: apuntar · Clic: disparar · 1 / 2: armas · F: linterna</p>
      <p class="help">Recoge cajas de munición (amarilla: pistola · roja: escopeta) y llega a la zona verde.</p>
    </div>
  </div>
  <div id="crosshair"></div>
  <div id="hitmarker"></div>
  <div id="hud">
    <div id="weaponName">PISTOLA</div>
    <div id="ammo">0</div>
    <div id="ammoOther"></div>
  </div>
  <div id="objective">
    Zombis: <span id="zleft">0</span><br>
    Extracción: <span id="dist">0</span> m
  </div>
  <div id="toast"></div>
  <div id="end" class="hidden">
    <h1 id="endTitle"></h1>
    <p id="endMsg"></p>
    <p class="help">Presiona R para reiniciar</p>
  </div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
